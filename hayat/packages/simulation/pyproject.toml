[project]
name = "hayat-simulation"
version = "0.1.0"
description = "HAYAT deterministic resilience simulation: days of cover, depletion, shortage risk, resilience score."
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hayat_simulation"]
